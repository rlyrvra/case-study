<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        function searchNav() {
            let input = document.getElementById("searchInput").value.toLowerCase();
            let subItems = document.querySelectorAll(".menu-sub .menu-item a");
            let mainItems = document.querySelectorAll(".navbar-nav > .menu-item > a");
            let resultsContainer = document.getElementById("searchResults");
            let hasResults = false;
            
            resultsContainer.innerHTML = "";
            
            // Search sub-menu items
            subItems.forEach(item => {
                let parentMenuElement = item.closest(".menu-sub").previousElementSibling.querySelector("div");
                let parentMenu = parentMenuElement ? parentMenuElement.textContent : "";
                let text = item.textContent.toLowerCase();
                if (text.includes(input) && input !== "") {
                    let listItem = document.createElement("li");
                    listItem.classList.add("list-group-item");
                    let link = document.createElement("a");
                    link.classList.add("nav-link");
                    link.href = item.href;
                    link.textContent = parentMenu ? `${parentMenu} > ${item.textContent}` : item.textContent;
                    listItem.appendChild(link);
                    resultsContainer.appendChild(listItem);
                    hasResults = true;
                }
            });
            
            // Search main menu items (excluding menu toggles like "Attendance")
            mainItems.forEach(item => {
                let text = item.textContent.toLowerCase();
                if (text.includes(input) && input !== "" && item.href !== "javascript:void(0);") {
                    let listItem = document.createElement("li");
                    listItem.classList.add("list-group-item");
                    let link = document.createElement("a");
                    link.classList.add("nav-link");
                    link.href = item.href;
                    link.textContent = item.textContent;
                    listItem.appendChild(link);
                    resultsContainer.appendChild(listItem);
                    hasResults = true;
                }
            });
            
            resultsContainer.style.display = hasResults ? "block" : "none";
        }
    </script>
    <style>
        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            background: white;
            width: 100%;
            max-width: 300px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">My Website</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">d
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="menu-item">
                        <a class="menu-link" href="smartWage-index">
                            <div>Dashboard</div>
                        </a>
                    </li>
                    <li class="menu-item">
                        <a class="menu-link" href="javascript:void(0);">
                            <div>Attendance</div>
                        </a>
                        <ul class="menu-sub">
                            <li class="menu-item"><a href="my-attendance" class="menu-link"><div>My Attendance</div></a></li>
                            <li class="menu-item"><a href="attendances" class="menu-link"><div>Attendance</div></a></li>
                            <li class="menu-item"><a href="work-schedule.php" class="menu-link"><div>Work Schedules</div></a></li>
                            <li class="menu-item"><a href="overtime-rate.php" class="menu-link"><div>Overtime Rates</div></a></li>
                            <li class="menu-item"><a href="holiday" class="menu-link"><div>Holidays</div></a></li>
                        </ul>
                    </li>
                </ul>
                <div class="navbar-nav align-items-center w-100 mt-3 position-relative">
                    <div class="input-group nav-item align-items-center w-100">
                        <span class="input-group-text"><i class="bx bx-search fs-4 lh-0"></i></span>
                        <input
                            id="searchInput"
                            type="text"
                            class="form-control border-0 shadow-none text-center"
                            onkeyup="searchNav()"
                            placeholder="Search..."
                            aria-label="Search..."
                        />
                    </div>
                    <ul class="list-group search-results mt-1" id="searchResults"></ul>
                </div>
            </div>
        </div>
    </nav>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

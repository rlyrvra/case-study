<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payday & Cutoff Calendar (2024-2025)</title>

    <script src='https://cdn.jsdelivr.net/npm/rrule@2.6.4/dist/es5/rrule.min.js'></script>

    <!-- FullCalendar CSS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">

    <!-- FullCalendar Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/rrule@5.11.3/main.global.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #calendar {
            max-width: 900px;
            margin: auto;
        }
    </style>
</head>
<body>

    <h2 style="text-align: center;">Payday & Cutoff Calendar (2025 - 2026)</h2>
    <div id="calendar"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var calendarEl = document.getElementById('calendar');

            var events = [];

            // Generate paydays and cutoff periods for 2 years (2024-2025)
            for (let year = 2025; year <= 2026; year++) {
                for (let month = 1; month <= 12; month++) {
                    let lastDay = new Date(year, month, 0).getDate(); // Last day of the month

                    let payday1 = adjustForSunday(new Date(year, month - 1, 21)); // Fixed payday (21st)
                    let payday2 = adjustForSunday(new Date(year, month, 6)); // Fixed payday (6th of next month)

                    let cutoff1Start = new Date(year, month - 1, 1);
                    let cutoff1End = new Date(year, month - 1, 16); // Move cutoff if on Sunday

                    let cutoff2Start = new Date(year, month - 1, 16); // Move cutoff if on Sunday
                    let cutoff2End = new Date(year, month - 1, lastDay);

                    events.push(
                        { title: 'Payday', start: payday1.toISOString().split('T')[0], color: 'red' },
                        { title: 'Payday', start: payday2.toISOString().split('T')[0], color: 'blue' },
                        { 
                            title: 'Cutoff Period 1', 
                            start: cutoff1Start.toISOString().split('T')[0], 
                            end: cutoff1End.toISOString().split('T')[0], 
                            color: 'red' 
                        },
                        { 
                            title: 'Cutoff Period 2', 
                            start: cutoff2Start.toISOString().split('T')[0], 
                            end: cutoff2End.toISOString().split('T')[0],
                            color: 'blue' 
                        }
                    );
                }
            }

            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                events: events
            });

            calendar.render();

            // Adjust cutoff if it falls on a Sunday (moves to Saturday before or Monday after)
            function adjustForSunday(date) {
                if (date.getDay() === 0) { // Sunday
                    let moveTo = "before"; // Change to "after" to move to Monday instead
                    return new Date(date.setDate(moveTo === "before" ? date.getDate() - 1 : date.getDate() + 1));
                }
                return date;
            }
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fancy SweetAlert Modal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .swal2-popup {
            border-radius: 20px;
            padding: 30px;
            background: linear-gradient(180deg, #58e877, #052a06);
            color: white;
        }
        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 4px solid white;
        }
        .user-info {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        .countdown-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 20px auto;
        }
        .countdown-circle {
            stroke-dasharray: 377 377;
            stroke-dashoffset: 377;
            transition: stroke-dashoffset 1s linear;
        }
        .countdown-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <button class="btn btn-primary" onclick="showFancyModal()">Open Modal</button>

    <script>
        function showFancyModal() {
            let countdown = 10;
            Swal.fire({
                title: '<h2 style="color: white;">User Information</h2>',
                html: `
                    <img src='https://via.placeholder.com/120' class='profile-pic'><br>
                    <div class='user-info'>
                        <p>👤 <strong>Full Name:</strong> John Doe</p>
                        <p>🕒 <strong>Check In:</strong> 10:00 AM</p>
                        <p>🚪 <strong>Check Out:</strong> 6:00 PM</p>
                        <p>✅ <strong>Status:</strong> Success</p>
                    </div>
                    <div class='countdown-container'>
                        <svg width="120" height="120">
                            <circle cx="60" cy="60" r="55" fill="none" stroke="#ddd" stroke-width="10"></circle>
                            <circle cx="60" cy="60" r="55" fill="none" stroke="#00ffcc" stroke-width="10" class="countdown-circle"></circle>
                        </svg>
                        <div class='countdown-text' id='timer'>${countdown}</div>
                    </div>
                `,
                showCancelButton: true,
                cancelButtonText: 'Close',
                showConfirmButton: false,
                didOpen: () => {
                    const timerSpan = document.getElementById('timer');
                    const circle = document.querySelector('.countdown-circle');
                    const interval = setInterval(() => {
                        countdown--;
                        timerSpan.textContent = countdown;
                        circle.style.strokeDashoffset = (377 * countdown) / 10;
                        if (countdown === 0) {
                            clearInterval(interval);
                            Swal.close();
                        }
                    }, 1000);
                }
            });
        }
    </script>
</body>
</html>
